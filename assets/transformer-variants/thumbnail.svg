        <rect x="9" y="36" width="23" height="23" opacity=".56"/><rect x="36" y="36" width="23" height="23" opacity=".9"/><rect x="63" y="36" width="23" height="23" opacity=".16"/><rect x="90" y="36" width="13" height="23" opacity=".06"/>
        <rect x="9" y="63" width="23" height="23" opacity=".22"/><rect x="36" y="63" width="23" height="23" opacity=".51"/><rect x="63" y="63" width="23" height="23" opacity=".82"/><rect x="90" y="63" width="13" height="23" opacity=".12"/>
        <rect x="9" y="90" width="23" height="13" opacity=".12"/><rect x="36" y="90" width="23" height="13" opacity=".28"/><rect x="63" y="90" width="23" height="13" opacity=".55"/><rect x="90" y="90" width="13" height="13" opacity=".9"/>
