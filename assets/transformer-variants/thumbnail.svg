<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Transformer variant experiment thumbnail</title>
  <desc id="description">Dense, local, and mixture-of-experts paths converge on a quality versus throughput chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#background)"/>
  <g opacity=".12" stroke="#93c5fd">
    <path d="M0 135h1200M0 270h1200M0 405h1200M0 540h1200"/>
    <path d="M200 0v675M400 0v675M600 0v675M800 0v675M1000 0v675"/>
  </g>
  <text x="72" y="82" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="30" font-weight="700">TRANSFORMER VARIANTS</text>
  <text x="72" y="118" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18">quality · context · throughput · internals</text>

  <g transform="translate(72 180)" font-family="system-ui,sans-serif">
