      <text x="62" y="57" fill="#99f6e4" font-size="14">SWA · Interleaved · Prefix state</text>
    </g>
    <g transform="translate(0 224)">
      <rect width="270" height="78" rx="16" fill="#4b2d4f" stroke="#e879f9"/>
      <g fill="#e879f9"><circle cx="26" cy="28" r="7"/><circle cx="48" cy="28" r="7"/><circle cx="26" cy="50" r="7"/><circle cx="48" cy="50" r="7"/></g>
